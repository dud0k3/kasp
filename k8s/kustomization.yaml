apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm-cpu
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: vllm-config
    literals:
      - MODEL_ID=Qwen/Qwen2.5-0.5B-Instruct
      - MODEL_REVISION=7ae557604adf67be50417f59c2c2f167def9a775
      - MODEL_ROOT=/models
      - VLLM_CPU_OMP_THREADS_BIND=nobind
      - OMP_NUM_THREADS=4
    files:
      - vllm.json
